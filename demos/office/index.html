<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lakshya Tech Park — a 3D office building website</title>
<meta name="description" content="Walk into a five-floor office building, pick a company, and let the concierge guide you to their floor. A 3D website built with Three.js by LakshyaAI Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed daylight 3D scene; HUD floats over it — brand top-left, dialog top-centre, directory right (bottom strip on phones), status pill bottom-centre. Single light look by choice: the building is always seen in daylight. */
:root{
  --sky:#e4e9ea;
  --ink:#1c2925;
  --muted:#5d6a64;
  --paper:rgba(255,255,255,.9);
  --paper-solid:#ffffff;
  --line:rgba(28,41,37,.12);
  --pine:#1f4a3d;
  --pine-soft:#e3ece7;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --ui:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}

.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;display:flex;flex-direction:column;gap:6px;z-index:5;pointer-events:none}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--pine);color:#fff;display:grid;place-items:center;font:600 15px/1 var(--display)}
.brand-name{font:600 19px/1.1 var(--display);letter-spacing:-.01em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.brand-sub{font:600 11px/1.2 var(--ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.where{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:600 12px/1.2 var(--ui);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.where b{font-family:var(--mono);font-weight:600;color:var(--pine);margin-right:6px}

.dialog{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px, calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;box-shadow:0 18px 40px -18px rgba(28,41,37,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10;transition:opacity .25s ease, transform .25s ease}
.dialog.fade{opacity:0;transform:translateX(-50%) translateY(-6px);pointer-events:none}
.eyebrow{font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.d-title{font:500 26px/1.15 var(--display);text-align:center;margin:8px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.d-sub{font:400 13.5px/1.45 var(--ui);color:var(--muted);text-align:center;text-wrap:pretty;margin:0 auto;max-width:36ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:9px;min-width:0;text-align:left;border:1px solid var(--line);background:var(--paper-solid);border-radius:11px;padding:10px 11px;font:600 13px/1.25 var(--ui);color:var(--ink);cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--pine);background:var(--pine-soft)}
.opt:focus-visible,.dir-row:focus-visible,.d-link:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.opt .dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c,var(--pine))}
.opt .lbl{flex:1;min-width:0}
.opt .lbl small{display:block;font:500 11px/1.3 var(--ui);color:var(--muted);margin-top:2px}
.opt .arr{color:var(--muted);font-size:13px}
.opt.primary{background:var(--pine);color:#fff;border-color:var(--pine);justify-content:center}
.opt.primary .arr{color:#cfe1d8}
.d-foot{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.d-link{background:none;border:0;padding:2px 0;font:600 12px/1.2 var(--ui);color:var(--pine);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.directory{position:fixed;right:16px;top:50%;transform:translateY(-50%);width:228px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;z-index:6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dir-head{font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:2px 4px 10px;display:flex;justify-content:space-between}
.dir-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.dir-row{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:9px;padding:7px 8px;cursor:pointer;text-align:left;color:var(--ink)}
.dir-row:hover{background:var(--pine-soft)}
.dir-row .lvl{font:600 12px/1 var(--mono);width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.dir-row .nm{flex:1;min-width:0;font:600 13px/1.2 var(--ui)}
.dir-row .nm small{display:block;font:500 11px/1.3 var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-row .sw{width:8px;height:22px;border-radius:3px;background:var(--c)}
.dir-row.here{background:var(--pine);color:#fff}
.dir-row.here .lvl,.dir-row.here .nm small{color:#cfe1d8}

.status{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pine);color:#fff;border-radius:999px;padding:9px 16px;font:600 13px/1.2 var(--ui);z-index:7;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(28,41,37,.6)}
.status .mono{font-family:var(--mono);margin-right:6px;color:#cfe1d8}
.hint{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:600 11.5px/1.3 var(--ui);color:var(--muted);z-index:4;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.7)}

#tags{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;left:0;top:0;background:var(--pine);color:#fff;font:700 10.5px/1 var(--ui);letter-spacing:.1em;padding:5px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.tag.staff{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}

.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--sky)}
.loading div{display:flex;flex-direction:column;align-items:center;gap:12px;font:500 14px var(--ui);color:var(--muted)}
.loading strong{font:600 22px var(--display);color:var(--ink)}
.bar{width:180px;height:4px;border-radius:4px;background:rgba(28,41,37,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pine);transition:width .2s}

@media (max-width: 760px){
  .directory{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:16px;left:16px;width:auto;transform:none;padding:8px}
  .dir-head{display:none}
  .dir-list{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .dir-list li{flex:none}
  .dir-row{padding:6px 9px;gap:7px}
  .dir-row .nm small{display:none}
  .dir-row .sw{height:16px;width:6px}
  .brand{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .brand-row,.brand-sub{display:none}
  .hint{display:none}
  .status{bottom:calc(122px + env(safe-area-inset-bottom,0px))}
  .d-title{font-size:22px}
  .dialog{padding:14px 14px 12px}
  .opt{padding:9px}
}
@media (prefers-reduced-motion: reduce){ .dialog,.opt{transition:none} }
</style>

</head>
<body>
<div id="stage" aria-label="3D view of the Lakshya Tech Park office building"></div>
<div class="loading" id="loading"><div><strong>Lakshya Tech Park</strong><span id="loadMsg">Preparing the building…</span><span class="bar"><i id="loadBar"></i></span></div></div>

<header class="brand">
  <div class="brand-row"><div class="brand-mark">L</div><div class="brand-name">Lakshya Tech Park</div></div>
  <div class="brand-sub">Managed by Lakshya Realty</div>
  <div class="where" id="where"><b>EXT</b>Outside the main entrance</div>
</header>

<section class="dialog fade" id="dialog" aria-live="polite">
  <div class="eyebrow" id="dEyebrow"></div>
  <h1 class="d-title" id="dTitle"></h1>
  <p class="d-sub" id="dSub"></p>
  <div class="opts" id="dOpts"></div>
  <div class="d-foot" id="dFoot"></div>
</section>

<aside class="directory" aria-label="Building directory">
  <div class="dir-head"><span>Building directory</span><span>6 levels</span></div>
  <ol class="dir-list" id="dirList"></ol>
</aside>

<div class="status" id="status" hidden></div>
<div class="hint">Drag to look around · scroll or pinch to zoom</div>
<div id="tags"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
(async function(){
'use strict';
const $ = id => document.getElementById(id);
const loadBar = $('loadBar'), loadMsg = $('loadMsg');
const progress = (p, msg) => { loadBar.style.width = Math.round(p*100)+'%'; if(msg) loadMsg.textContent = msg; };
const tick = () => new Promise(r => setTimeout(r, 0));

if (!window.THREE) { loadMsg.textContent = 'The 3D engine could not load. Check your connection and reload.'; return; }

// ======================= data =======================
const H = 4.2, W = 40, D = 24, WALL = H - .36;
const BANYAN = { name:'Lakshya Tech Park', mgr:'Lakshya Realty', accent:'#1f4a3d' };
const COMPANIES = [
  { floor:1, name:'Pixelmint', kind:'Brand & product design studio', accent:'#2f9e94', carpet:'#5d6f70', rooms:{
    workspace:{name:'Design Studio', desc:'Designers on open benches, with live Figma boards on the shared screens.'},
    meeting:{name:'Critique Room', desc:'Weekly design critiques happen here. Client screen at the far end.'},
    cabin:{name:'Creative Director', desc:'Meera Iyer, Creative Director. Portfolio reviews by appointment.'},
    lounge:{name:'Moodboard Lounge', desc:'Sofas, sketchbooks and the coffee machine the whole floor shares.'} } },
  { floor:2, name:'Ledgerly', kind:'Payments for small businesses', accent:'#d4962a', carpet:'#6a6660', rooms:{
    workspace:{name:'Engineering Bay', desc:'Backend and mobile squads. The on-call dashboard runs on the far wall.'},
    meeting:{name:'War Room', desc:'Release planning and incident reviews. Whiteboards on every wall.'},
    cabin:{name:"CEO's Cabin", desc:'Arjun Menon, Co-founder & CEO.'},
    lounge:{name:'Chai Point', desc:'Chai at 11 and 4. Most product ideas start here.'} } },
  { floor:3, name:'Kiln Labs', kind:'Applied AI research', accent:'#dd6c55', carpet:'#5f6266', rooms:{
    workspace:{name:'Research Floor', desc:'Researchers and ML engineers. Training runs are tracked on the shared screens.'},
    meeting:{name:'Model Review Room', desc:'Every model is reviewed here before it ships.'},
    cabin:{name:"Founder's Cabin", desc:'Dr. Kavya Rao, Founder & Chief Scientist.'},
    lounge:{name:'Reading Nook', desc:'Papers, a whiteboard and a quiet corner for deep work.'} } },
  { floor:4, name:'Saffron & Co.', kind:'Corporate law chambers', accent:'#4c5ea2', carpet:'#565c6c', rooms:{
    workspace:{name:'Associates Floor', desc:'Associates and paralegals. Filing deadlines are pinned by the window.'},
    meeting:{name:'Conference Room', desc:'Client meetings and deal closings. Seats ten.'},
    cabin:{name:'Senior Partner', desc:'Rohan Saxena, Senior Partner, Corporate & M&A.'},
    lounge:{name:'Law Library', desc:'Case reporters, bare acts and a long reading sofa.'} } },
  { floor:5, name:'Cedar Health', kind:'Telehealth platform', accent:'#4b8a5b', carpet:'#5e675e', rooms:{
    workspace:{name:'Care Operations', desc:'Care coordinators matching patients to doctors across India.'},
    meeting:{name:'Huddle Room', desc:'Morning clinical huddle at 9:30 sharp.'},
    cabin:{name:'Medical Director', desc:'Dr. Sana Qureshi, Medical Director.'},
    lounge:{name:'Wellness Corner', desc:'Plants, daylight and a no-laptops rule.'} } },
];
const ROOM_ORDER = ['workspace','meeting','cabin','lounge'];
const company = L => COMPANIES.find(c => c.floor === L);
const levelLabel = L => L === 0 ? 'G' : 'L' + L;

// Navigation: every location hangs off a corridor running along z = 0
const NAVF = {
  lift:{cx:-12.2, chain:[]},
  cab:{cx:-12.2, chain:[[-17.2,0]]},
  liftSide:{cx:-12.2, chain:[[-12.9,2.1]]},
  desk:{cx:-8, chain:[[-8,-2.3]], face:[-8,-5]},
  staff:{cx:-11, chain:[[-11,-1.2],[-11,-5.3],[-8,-5.3]], face:[-8,0]},
  workspace:{cx:4, chain:[[4,2.0],[4,6.9]], face:[1,6.9]},
  meeting:{cx:1, chain:[[1,-3.3],[1,-5.2]], face:[1,-9]},
  cabin:{cx:12, chain:[[12,-3.3],[13.4,-6.6]], face:[15,-9]},
  lounge:{cx:-9.6, chain:[[-9.6,2.0],[-9.6,5.2]], face:[-11.5,7], doorSide:-1},
};
const NAV0 = {
  lift:NAVF.lift, cab:NAVF.cab, liftSide:NAVF.liftSide,
  desk:{cx:4, chain:[[4,-2.3]], face:[4,-5]},
  staff:{cx:7.4, chain:[[7.4,-1.2],[7.4,-5.3],[4,-5.3]], face:[4,0]},
  entrance:{cx:0, chain:[[0,12.6],[0,19]]},
};
const navFor = L => L === 0 ? NAV0 : NAVF;

// ======================= fonts + model =======================
progress(.05,'Loading fonts…');
try {
  await Promise.race([
    Promise.all(['600 64px Fraunces','500 64px Fraunces','600 40px "Hanken Grotesk"','700 40px "Hanken Grotesk"','600 40px "JetBrains Mono"'].map(f=>document.fonts.load(f))),
    new Promise(r=>setTimeout(r,2500))
  ]);
} catch(e) {}

progress(.1,'Loading people…');
async function fetchGLB(url, p0, p1, expect){
  const resp = await fetch(url); if(!resp.ok) throw new Error(url);
  const total = +resp.headers.get('content-length') || expect; const reader = resp.body.getReader(); const parts = []; let got = 0;
  for(;;){ const {done, value} = await reader.read(); if(done) break; parts.push(value); got += value.length; progress(p0 + (p1-p0)*Math.min(1, got/total)); }
  const b64 = new TextDecoder().decode(await new Blob(parts).arrayBuffer());
  const bin = atob(b64.trim()), buf = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return new Promise((res, rej) => new THREE.GLTFLoader().parse(buf.buffer, '', res, rej));
}
let RAW = null;
if (THREE.GLTFLoader && THREE.SkeletonUtils) {
  try {
    const [anims, man, woman] = await Promise.all([fetchGLB('anims.b64.txt',.1,.18,1389420), fetchGLB('man.b64.txt',.18,.3,2451848), fetchGLB('woman.b64.txt',.3,.5,4369184)]);
    RAW = {anims, man, woman};
  } catch(e) { console.warn('People models unavailable, using simple figures', e); RAW = null; }
}

// ======================= renderer / scene =======================
progress(.52,'Lighting the lobby…'); await tick();
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const scene = new THREE.Scene();
const HORIZON = '#e7ecec';
scene.background = lin(HORIZON);
scene.fog = new THREE.Fog(lin(HORIZON), 120, 380);
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.4, 900);

function skyDome(r, top, mid, bot, mult=1){
  const g = new THREE.SphereGeometry(r, 32, 16);
  const cols = [], p = g.attributes.position, c = new THREE.Color();
  const T = lin(top), M = lin(mid), B = lin(bot);
  for(let i=0;i<p.count;i++){ const y = p.getY(i)/r; if(y>0) c.copy(M).lerp(T, Math.pow(y,.6)); else c.copy(M).lerp(B, Math.min(1,-y*4)); c.multiplyScalar(mult); cols.push(c.r,c.g,c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.BackSide, fog:false, toneMapped:false, depthWrite:false}));
}
scene.add(skyDome(600, '#a9c7df', HORIZON, '#cfd1c8'));

// environment for reflections
{
  const env = new THREE.Scene();
  env.add(skyDome(50, '#b8d2e8', '#f2f0ea', '#8a8375', 1.15));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(3,16,8), new THREE.MeshBasicMaterial({color:new THREE.Color(1,.95,.86).multiplyScalar(40)}));
  sunBall.position.set(24,38,18); env.add(sunBall);
  for(const [x,z] of [[-40,10],[10,-40]]){ const pnl = new THREE.Mesh(new THREE.PlaneGeometry(30,14), new THREE.MeshBasicMaterial({color:new THREE.Color(1,1,1).multiplyScalar(2.2), side:THREE.DoubleSide})); pnl.position.set(x,12,z); pnl.lookAt(0,10,0); env.add(pnl); }
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, .03).texture;
  pm.dispose();
}

const hemi = new THREE.HemisphereLight(lin('#dfe9f2'), lin('#a99d88'), .38); scene.add(hemi);
const sun = new THREE.DirectionalLight(lin('#ffeed6'), 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera; sc.left=-30; sc.right=30; sc.top=30; sc.bottom=-30; sc.near=1; sc.far=240;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

// ======================= procedural textures =======================
progress(.58,'Laying the floors…'); await tick();
const rnd = (() => { let s = 1234567; return () => (s = (s*16807) % 2147483647) / 2147483647; })();
function cvs(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function tex(c, srgb=true){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = ANISO; if(srgb) t.encoding = THREE.sRGBEncoding; return t; }
function blotch(x, w, h, cells, alpha, light=false){
  const [b, bx] = cvs(cells, cells); const id = bx.createImageData(cells, cells);
  for(let i=0;i<id.data.length;i+=4){ const v = rnd()*255; id.data[i]=id.data[i+1]=id.data[i+2]= light? 255 : 0; id.data[i+3]=v; }
  bx.putImageData(id,0,0); x.save(); x.globalAlpha = alpha; x.imageSmoothingEnabled = true; x.drawImage(b,0,0,w,h); x.restore();
}
function grain(x, w, h, amp){
  const id = x.getImageData(0,0,w,h), d = id.data;
  for(let i=0;i<d.length;i+=4){ const n = (rnd()-.5)*amp; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  x.putImageData(id,0,0);
}
function woodGrain(x, w, h, lines, col, alpha){
  for(let i=0;i<lines;i++){
    const y0 = rnd()*h, f = .004+rnd()*.01, a = 1+rnd()*4, ph = rnd()*6;
    x.strokeStyle = col; x.globalAlpha = alpha*(.3+rnd()*.7); x.lineWidth = .5+rnd()*2.2;
    x.beginPath(); for(let px=0;px<=w;px+=8){ const py = y0 + Math.sin(px*f+ph)*a + Math.sin(px*f*3.1+ph)*a*.3; px?x.lineTo(px,py):x.moveTo(px,py); } x.stroke();
  }
  x.globalAlpha = 1;
}
const T = {};
{ // plaster
  const [c,x] = cvs(512,512); x.fillStyle='#f1eee8'; x.fillRect(0,0,512,512); blotch(x,512,512,16,.05); blotch(x,512,512,64,.03,true); grain(x,512,512,6); T.plaster = tex(c);
}
{ // oak
  const [c,x] = cvs(512,512); x.fillStyle='#c9a47b'; x.fillRect(0,0,512,512); blotch(x,512,512,8,.08); woodGrain(x,512,512,260,'#7a5434',.22); woodGrain(x,512,512,80,'#e7c9a2',.25); grain(x,512,512,6); T.oak = tex(c);
}
{ // walnut
  const [c,x] = cvs(512,512); x.fillStyle='#6a4a34'; x.fillRect(0,0,512,512); blotch(x,512,512,8,.12); woodGrain(x,512,512,260,'#2f1f15',.3); woodGrain(x,512,512,60,'#8f6a4c',.25); grain(x,512,512,5); T.walnut = tex(c);
}
{ // floor planks (texture spans 6 units)
  const S=1024, [c,x] = cvs(S,S); x.fillStyle='#cdbba1'; x.fillRect(0,0,S,S);
  const rowH = 40;
  for(let y=0;y<S;y+=rowH){ let px = -rnd()*240; while(px<S){ const len = 180+rnd()*160; const t = (rnd()-.5)*26;
    x.fillStyle = `rgb(${205+t},${188+t*.9},${160+t*.8})`; x.fillRect(px,y,len,rowH);

// ======================= baking (merge static meshes per material) =======================
function boxUV(g, s){
  const p = g.attributes.position, n = g.attributes.normal, uv = new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){ const ax=Math.abs(n.getX(i)), ay=Math.abs(n.getY(i)), az=Math.abs(n.getZ(i)); let u,v;
    if(ay>=ax && ay>=az){ u=p.getX(i); v=p.getZ(i); } else if(ax>=az){ u=p.getZ(i); v=p.getY(i); } else { u=p.getX(i); v=p.getY(i); }
    uv[i*2]=u/s; uv[i*2+1]=v/s; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv,2));
}
function bake(group){
  group.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
  const buckets = new Map(), dead = [];
  const visit = o => {
    if(o.userData.keep) return;
    if(o.isMesh && !o.isSkinnedMesh){
      const m4 = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
      let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      if(!g.attributes.normal) g.computeVertexNormals();
      g.applyMatrix4(m4);
      if(!o.material.userData.keepUV) boxUV(g, o.material.userData.uvScale || 2);
      if(!buckets.has(o.material)) buckets.set(o.material, []);
      buckets.get(o.material).push(g); dead.push(o); o.geometry.dispose();
    }
    o.children.forEach(visit);
  };
  group.children.slice().forEach(visit);
  dead.forEach(o => o.parent && o.parent.remove(o));
  for(const [mat, list] of buckets){
    let n = 0; list.forEach(g => n += g.attributes.position.count);
    const pos = new Float32Array(n*3), nor = new Float32Array(n*3), uv = new Float32Array(n*2); let off = 0;
    for(const g of list){ const c = g.attributes.position.count; pos.set(g.attributes.position.array, off*3); nor.set(g.attributes.normal.array, off*3); if(g.attributes.uv) uv.set(g.attributes.uv.array, off*2); off += c; g.dispose(); }
    const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.BufferAttribute(pos,3)); mg.setAttribute('normal', new THREE.BufferAttribute(nor,3)); mg.setAttribute('uv', new THREE.BufferAttribute(uv,2)); mg.computeBoundingSphere();
    const mesh = new THREE.Mesh(mg, mat);
    mesh.castShadow = !mat.transparent && !mat.userData.noCast; mesh.receiveShadow = !mat.userData.noReceive;
    if(mat.userData.alphaShadow) mesh.customDepthMaterial = new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking, map:mat.map, alphaTest:.5});
    group.add(mesh);
  }
}

const tweens = [];
const ease = k => k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;

const delay = ms => new Promise(r=>setTimeout(r,ms));
const walkers = new Set();
const WALK = CH ? 2.15 : 3.2;
function walkPts(p, pts, speed=WALK, follow=null, gap=1.9){ return new Promise(res=>{ const u=p.userData; u.path=pts; u.speed=speed; u.done=res; u.follow=follow; u.gap=gap; walkers.add(p); }); }
function buildPath(from,to){ const pts=[]; const push=(x,z)=>{ const l=pts[pts.length-1]; if(!l||Math.hypot(l.x-x,l.z-z)>.01) pts.push({x,z}); };
  [...from.chain].reverse().forEach(([x,z])=>push(x,z)); push(from.cx,0); push(to.cx,0); to.chain.forEach(([x,z])=>push(x,z)); return pts; }
function walkTo(p, key, opts={}){
  const L = p.userData.level ?? S.level;
  let to = typeof key==='string' ? navFor(L)[key] : key;
  if(opts.door){ const d=to.chain[0]; to={cx:to.cx, chain:[[d[0]+1.4*(to.doorSide||1),d[1]]]}; }
  const pts = buildPath(p.userData.loc, to); p.userData.loc = to;
  return walkPts(p, pts, opts.speed, opts.follow, opts.gap).then(()=>{ if(to.face) face(p,to.face[0],to.face[1]); });
}
function face(p,x,z){ p.userData.yawT = Math.atan2(x-p.position.x, z-p.position.z); }
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }

  hideRoute(true);
  const W2 = .2, pos=[], uv=[], idx=[]; let acc=0, vi=0;
  for(let i=0;i<pts.length-1;i++){ const a=pts[i], b=pts[i+1], dx=b.x-a.x, dz=b.z-a.z, len=Math.hypot(dx,dz); if(len<.05) continue; const nx=-dz/len*W2, nz=dx/len*W2;
    pos.push(a.x-nx,0,a.z-nz, a.x+nx,0,a.z+nz, b.x+nx,0,b.z+nz, b.x-nx,0,b.z-nz);
    const u0=acc/.7, u1=(acc+len)/.7; uv.push(u0,0, u0,1, u1,1, u1,0); idx.push(vi,vi+1,vi+2, vi,vi+2,vi+3); vi+=4; acc+=len; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx);
  const t = routeTex.clone(); t.needsUpdate = true;
  const m = new THREE.MeshBasicMaterial({map:t, color:lin(color||'#1f4a3d'), transparent:true, opacity:0, depthWrite:false, toneMapped:false, side:THREE.DoubleSide});
  const mesh = new THREE.Mesh(g, m); mesh.position.y = L*H + .05; mesh.renderOrder = 2;
  const endPt = pts[pts.length-1];
  const ring = new THREE.Mesh(new THREE.RingGeometry(.32,.46,40), new THREE.MeshBasicMaterial({color:lin(color||'#1f4a3d'), transparent:true, opacity:0, depthWrite:false, toneMapped:false}));
  ring.rotation.x = -Math.PI/2; ring.position.set(endPt.x, L*H + .055, endPt.z);
  scene.add(mesh); scene.add(ring);
  route = {mesh, ring, tex:t, mats:[m, ring.material], target:.9, op:0};
}
function hideRoute(now){ if(!route) return; if(now){ scene.remove(route.mesh, route.ring); route.mesh.geometry.dispose(); route = null; return; } route.target = 0; }
function updateRoute(dt){ if(!route) return; route.tex.offset.x -= dt*1.1; route.op += (route.target-route.op)*Math.min(1,dt*5); route.mats.forEach(m=>m.opacity=route.op); const k=1+.15*Math.sin(performance.now()/260); route.ring.scale.set(k,k,k); if(route.target===0 && route.op<.02) hideRoute(true); }

// ======================= UI =======================
const dlg=$('dialog'), stEl=$('status');
function status(html){ if(!html){ stEl.hidden=true; return; } stEl.innerHTML=html; stEl.hidden=false; }
function showDialog({eyebrow,title,sub,options=[],foot=[]}){
  $('dEyebrow').textContent=eyebrow||''; $('dTitle').textContent=title||''; $('dSub').textContent=sub||'';
  const o=$('dOpts'); o.innerHTML=''; o.className='opts'+(options.length===1?' one':''); o.hidden=!options.length;
  options.forEach(op=>{ const b=document.createElement('button'); b.type='button'; b.className='opt'+(op.primary?' primary':''); if(op.color) b.style.setProperty('--c',op.color);
    b.innerHTML=(op.color?'<span class="dot"></span>':'')+'<span class="lbl"></span><span class="arr">→</span>'; b.querySelector('.lbl').textContent=op.label;
    if(op.meta){ const s=document.createElement('small'); s.textContent=op.meta; b.querySelector('.lbl').appendChild(s); }
    b.addEventListener('click',()=>{ if(!S.busy) op.run(); }); o.appendChild(b); });
  const f=$('dFoot'); f.innerHTML=''; f.hidden=!foot.length;
  foot.forEach(op=>{ const b=document.createElement('button'); b.type='button'; b.className='d-link'; b.textContent=op.label; b.addEventListener('click',()=>{ if(!S.busy) op.run(); }); f.appendChild(b); });
  dlg.classList.remove('fade');
}
function hideDialog(){ dlg.classList.add('fade'); }
function where(html){ $('where').innerHTML=html; }
function updateWhere(spot){ const L=S.level; if(S.mode==='overview') return where('<b>EXT</b>Outside the main entrance'); if(L===0) return where('<b>G</b>Lobby'+(spot?' · '+spot:'')); where(`<b>${levelLabel(L)}</b>${company(L).name}${spot?' · '+spot:''}`); }

const dirList=$('dirList');
function renderDirectory(){
  dirList.innerHTML='';
  const rows=[...COMPANIES].reverse().map(c=>({L:c.floor,name:c.name,sub:c.kind,color:c.accent})).concat([{L:0,name:'Lobby',sub:'Concierge · Lakshya Café',color:BANYAN.accent}]);
  rows.forEach(r=>{ const li=document.createElement('li'); const b=document.createElement('button'); b.type='button'; b.className='dir-row'+(S.mode==='follow'&&S.level===r.L?' here':''); b.style.setProperty('--c',r.color);
    b.innerHTML='<span class="lvl">'+levelLabel(r.L)+'</span><span class="nm"></span><span class="sw"></span>'; const nm=b.querySelector('.nm'); nm.textContent=r.name; const s=document.createElement('small'); s.textContent=r.sub; nm.appendChild(s);
    b.addEventListener('click',()=>directoryGo(r.L)); li.appendChild(b); dirList.appendChild(li); });
}

// ======================= flows =======================
async function run(fn){ if(S.busy) return; S.busy=true; try{ await fn(); } finally { S.busy=false; renderDirectory(); } }
function introDialog(){
  showDialog({eyebrow:'Managed by '+BANYAN.mgr, title:BANYAN.name, sub:'Five office floors above one shared lobby. Each company runs its own reception.', options:[{label:'Walk in through the main entrance', primary:true, run:()=>run(enter)}]});
}
async function enter(then){
  hideDialog(); S.mode='follow'; S.level=0; setVisibleMax(0); followDefaults(); renderDirectory(); updateWhere();
  status('Walking to the concierge…');
  await walkTo(you,'desk');
  status(); updateWhere('Concierge'); gesture(receptionists[0],'agree');
  if(then) return then();
  lobbyMenu();
}
function lobbyMenu(){
  showDialog({eyebrow:BANYAN.mgr+' · Concierge', title:'Welcome to '+BANYAN.name, sub:'Who are you visiting today?',
    options:COMPANIES.map(c=>({label:c.name, meta:'Level '+c.floor+' · '+c.kind, color:c.accent, run:()=>run(()=>visitCompany(c))}))});
}
// The host steps out from behind the desk, points the way, draws the route on the floor, then walks ahead while the visitor follows.
async function leadTo(host, key, o){
  const L = S.level, nav = navFor(L), dest = nav[key], desk = nav.desk;
  const sign = Math.sign(dest.cx - desk.cx) || 1;
  const leadX = desk.cx + sign*1.8;
  // 1. step out to meet the visitor
  await walkTo(host, {cx:leadX, chain:[]});
  face(host, you.position.x, you.position.z); face(you, host.position.x, host.position.z);
  await delay(300);
  // 2. show the way: point + route on the floor
  const end = dest.chain.length ? dest.chain[dest.chain.length-1] : [dest.cx, 0];
  const aim = o.aim || end;
  pointAt(host, aim[0], aim[1], 2000);
  showRoute(L, buildPath(you.userData.loc, dest), o.color);
  showDialog({eyebrow:o.who, title:'This way, please', sub:`${o.label} is down the corridor on your ${sign>0?'right':'left'}. I'll walk you there.`});
  await delay(2100);
  // 3. walk ahead; the visitor follows a couple of steps behind
  const hostWalk = o.hostKey ? walkTo(host, o.hostKey) : walkTo(host, key, {door:true});
  await delay(500);
  const visitorWalk = walkTo(you, key, {follow:host, gap:1.9});
  await hostWalk;
  face(host, you.position.x, you.position.z);
  await delay(250);
  pointAt(host, aim[0], aim[1], 1600);
  await visitorWalk;
  hideRoute();
  face(host, you.position.x, you.position.z);
}
async function visitCompany(c){
  showDialog({eyebrow:'Your visit', title:c.name, sub:`Level ${c.floor}. The concierge will take you to the lifts.`});
  await delay(700);
  const conc = receptionists[0];
  await leadTo(conc, 'lift', {who:BANYAN.mgr+' · Concierge', label:'The lift', aim:[-14.6,0], hostKey:'liftSide', color:BANYAN.accent});
  showDialog({eyebrow:'Concierge', title:'Here are the lifts', sub:`Take it up to level ${c.floor}. ${c.name}'s reception is right outside.`});
  gesture(conc,'agree');
  await delay(1200);
  hideDialog();
  const ride_ = ride(c.floor);
  delay(2400).then(()=>walkTo(conc,'staff'));
  await ride_;
  await arriveFloor();
}
async function arriveFloor(){
  const L=S.level; status(L===0?'Walking to the concierge…':'Walking to reception…');
  await walkTo(you,'desk'); status(); gesture(receptionists[L],'agree');
  if(L===0){ updateWhere('Concierge'); lobbyMenu(); } else { updateWhere('Reception'); floorMenu(); }
}
async function ride(to){
  const from=S.level;
  if(cab.userData.level!==from){ status('Calling the lift…'); await moveCab(from,false); }
  status('Lift arriving'); await doors(from,true);
  await walkTo(you,'cab'); face(you,-10,0);
  await doors(from,false);
  await moveCab(to,true);
  S.level=to; setVisibleMax(to); updateWhere(); renderDirectory();
  you.userData.loc = navFor(to).cab;
  await doors(to,true); status();
  await walkTo(you,'lift'); doors(to,false);
}
function floorMenu(){
  const c=company(S.level);
  showDialog({eyebrow:c.name+' · Receptionist', title:'How can I help you?', sub:`Welcome to ${c.name}. Where would you like to go?`,
    options:ROOM_ORDER.map(k=>({label:c.rooms[k].name, run:()=>run(()=>visitRoom(k))})),
    foot:[{label:'Visit another company', run:()=>run(liftPanel)},{label:'Back to the lobby', run:()=>run(()=>goTo(0))}]});
}
async function visitRoom(k){
  const c=company(S.level), r=c.rooms[k], rec=receptionists[S.level];
  showDialog({eyebrow:'Your visit', title:r.name, sub:'Your receptionist will show you the way.'});
  updateWhere(r.name);
  gesture(rec,'agree');
  await delay(900);
  const inside = navFor(S.level)[k].chain.slice(-1)[0];
  await leadTo(rec, k, {who:c.name+' · Receptionist', label:r.name, aim:inside, color:c.accent});
  showDialog({eyebrow:'Your visit', title:r.name, sub:'Please step inside.'});
  await delay(1000);
  walkTo(rec,'staff');
  showDialog({eyebrow:c.name+' · '+levelLabel(S.level), title:r.name, sub:r.desc,
    options:[{label:'Another room on this floor', run:()=>run(async()=>{ hideDialog(); status('Walking back to reception…'); await walkTo(you,'desk'); status(); updateWhere('Reception'); gesture(rec,'agree'); floorMenu(); })},
             {label:'Visit another company', run:()=>run(liftPanel)}],
    foot:[{label:'Back to the lobby', run:()=>run(()=>goTo(0))}]});
}
async function liftPanel(){
  hideDialog(); status('Walking to the lifts…');
  await walkTo(you,'lift'); status(); updateWhere('Lifts');
  showDialog({eyebrow:'Lift · '+levelLabel(S.level), title:'Choose a floor', sub:'Every floor has its own reception desk.',
    options:[...COMPANIES].reverse().filter(c=>c.floor!==S.level).map(c=>({label:c.name, meta:'Level '+c.floor, color:c.accent, run:()=>run(()=>goTo(c.floor,true))}))
      .concat(S.level!==0?[{label:'Lobby', meta:'Ground · Concierge', color:BANYAN.accent, run:()=>run(()=>goTo(0,true))}]:[])});
}
async function goTo(L, atLift){
  hideDialog();
  if(L===S.level){ await arriveFloor(); return; }
  if(!atLift){ status('Walking to the lifts…'); await walkTo(you,'lift'); }
  await ride(L);
  await arriveFloor();
}
function directoryGo(L){
  if(S.busy){ status('One moment, you are on the move'); setTimeout(()=>{ if(stEl.textContent.startsWith('One moment')) status(); },1400); return; }
  if(S.mode==='overview'){ run(()=>enter(L===0?null:()=>visitCompany(company(L)))); return; }
  run(()=>goTo(L));
}

// ======================= loop =======================
const clock = new THREE.Clock();
const perf = {n:0, t:0, level:0};
const tmp = new THREE.Vector3();
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  updateRoute(dt); updateTraffic(dt);
  for(let i=tweens.length-1;i>=0;i--){ const t=tweens[i]; t.t+=dt; const k=Math.min(1,t.t/t.dur); t.fn(ease(k)); if(k>=1){ tweens.splice(i,1); t.res(); } }
  for(const p of walkers){ const u=p.userData; const tg=u.path[0];
    if(!tg){ walkers.delete(p); u.moving=false; const d=u.done; u.done=null; d&&d(); continue; }
    let sp=u.speed;
    if(u.follow && walkers.has(u.follow)){ const f=u.follow.position; const gap=Math.hypot(f.x-p.position.x, f.z-p.position.z); sp *= Math.max(0, Math.min(1.12, (gap-u.gap)/.9)); }
    const dx=tg.x-p.position.x, dz=tg.z-p.position.z, d=Math.hypot(dx,dz), st=sp*dt;
    if(d<=st){ p.position.x=tg.x; p.position.z=tg.z; u.path.shift(); } else if(st>0){ p.position.x+=dx/d*st; p.position.z+=dz/d*st; u.yawT=Math.atan2(dx,dz); }
    u.moving = sp > u.speed*.3; }
  for(const p of humans){
    const u=p.userData; u.yaw=lerpAngle(u.yaw,u.yawT,Math.min(1,dt*8)); p.rotation.y=u.yaw;
    if(u.mixer){
      const vis = p===you || (p.parent && p.parent.visible && p.parent.parent && p.parent.parent.visible);
      if(!STANCES.includes(u.cur)){ if(u.moving) endPose(p); }
      else { const want = u.moving?'walk':'idle'; if(u.cur!==want){ u.actions[want].reset().fadeIn(.25).play(); u.actions[u.cur].fadeOut(.25); u.cur=want; } }
      if(vis) u.mixer.update(dt);
    } else if(u.legs){
      if(u.moving){ u.phase+=dt*9; const s=Math.sin(u.phase); u.legs[0].rotation.x=s*.6; u.legs[1].rotation.x=-s*.6; u.arms[0].rotation.x=-s*.5; u.arms[1].rotation.x=s*.5; }
      else { for(const l of [...u.legs,...u.arms]) l.rotation.x*=.8; }
    }
  }
  floors.forEach((g,i)=>{ const u=g.userData; u.h+=(u.ht-u.h)*Math.min(1,dt*4.5); g.position.y=u.baseY+u.h*36; g.visible=u.h<.96;
    if(facades[i]) facades[i].visible = S.mode==='overview' || i<S.vis;
    interiors[i].visible = S.mode==='overview' || i>=S.vis;
    peopleGroups[i].visible = S.mode==='follow' && i===S.vis; });
  if(S.mode==='follow'){ const k2 = narrow()?4.2:3.4; camT.target.set(you.position.x*.8 - Math.sin(cam.theta)*k2, you.position.y+1, you.position.z*.8 - Math.cos(cam.theta)*k2); }
  else { camT.target.set(0,16,0); if(!pointers.size && performance.now()-lastDrag>2500) camT.theta = .78 + Math.sin(performance.now()/6000)*.16; }
  const k=Math.min(1,dt*(S.riding?9:3));
  cam.theta+=(camT.theta-cam.theta)*k; cam.phi+=(camT.phi-cam.phi)*k; cam.dist+=(camT.dist-cam.dist)*k*.8; cam.target.lerp(camT.target,k);
  camera.position.set(cam.target.x+cam.dist*Math.sin(cam.phi)*Math.sin(cam.theta), cam.target.y+cam.dist*Math.cos(cam.phi), cam.target.z+cam.dist*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.target);
  const span = S.mode==='overview' ? 40 : 28; if(sc.right!==span){ sc.left=-span; sc.right=span; sc.top=span; sc.bottom=-span; sc.updateProjectionMatrix(); }
  const ts = 2*span/sun.shadow.mapSize.x, sx = Math.round(cam.target.x/ts)*ts, sy = Math.round(cam.target.y/ts)*ts, sz = Math.round(cam.target.z/ts)*ts;
  sun.position.set(sx+34, sy+66, sz+30); sun.target.position.set(sx, sy, sz);
  renderer.render(scene,camera);
  // adaptive quality: step down on slow devices
  perf.n++; perf.t += dt; if(perf.t > 2.5){ const fps = perf.n/perf.t; perf.n = 0; perf.t = 0;
    if(fps < 28 && perf.level === 0){ perf.level = 1; renderer.setPixelRatio(1); }
    else if(fps < 22 && perf.level === 1){ perf.level = 2; sun.shadow.mapSize.set(1024,1024); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; } } }
  for(const t of tags){ const show=t.cond(); if(!show){ t.el.hidden=true; continue; }
    t.obj.getWorldPosition(tmp); tmp.y+=2.45; tmp.project(camera);
    if(tmp.z>1){ t.el.hidden=true; continue; }
    t.el.hidden=false; t.el.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth}px,${(-tmp.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`; }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });

progress(1,'Opening the doors…');
renderDirectory(); updateWhere(); introDialog();
requestAnimationFrame(frame);
setTimeout(()=>$('loading').remove(), 150);
})();
</script>
</body>
